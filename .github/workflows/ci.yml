name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Prevent duplicate runs for the same branch/PR updates
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CLI artifact validation tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y groff man-db zsh

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v4's "latest" resolved to golangci-lint v1.64.8 (go1.24), which
          # cannot lint a Go 1.27 module. v2.13.0 added Go 1.27 support.
          version: v2.13.1

      - name: Test
        run: make test

      - name: Integration Test
        run: make test-integration

      - name: Generate and validate CLI artifacts
        shell: bash
        run: |
          make release-artifacts VERSION=ci RELEASE_DIR=dist
          test -s dist/completions/monodev.bash
          test -s dist/completions/_monodev
          test -s dist/completions/monodev.fish
          test -s dist/man/monodev.1
          zsh -n dist/completions/_monodev
          zsh -f -c 'autoload -Uz compinit; compinit -D; source "$1"' zsh "$PWD/dist/completions/_monodev"

          VERSION="$(./dist/monodev version)"
          MAN_OUTPUT="$(MANPAGER=cat man dist/man/monodev.1 2>/dev/null)"
          grep -Fq "$VERSION" <<< "$MAN_OUTPUT"
