name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

# Prevent duplicate runs for the same branch/PR updates
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          # v4's "latest" resolved to golangci-lint v1.64.8 (go1.24), which
          # cannot lint a Go 1.27 module. v2.13.0 added Go 1.27 support.
          version: v2.13.1

      - name: Test
        run: make test

      - name: Integration Test
        run: make test-integration
